schema_version: "vabench-release-v2-checks"
task_id: "vbr1_l2_amplifier_filter_chain:e2e"
checker:
  task_id: "vbr1_l2_amplifier_filter_chain_e2e"
  function: "check_release_amplifier_filter_chain"
  source: "runners/simulate_evas.py"
# The remaining fields are inherited from release-v1 and remain private
# evaluator configuration until human review and fresh v2 dual rerun.
syntax:
  must_include:
    - "transition("
    - "@(cross("
  must_not_include:
    - "I("
    - "ddt("
dut_compile:
  backend: "evas"
tb_compile:
  backend: "evas"
sim_correct:
  checks:
    - "amplified_input"
    - "preamp_monitor_matches_metric"
    - "two_pole_internal_lag_visible"
    - "filtered_output_lags_input"
    - "metric_tracks_settling"
    - "settle_status_asserts_after_output_recovery"
parity:
  reference: "spectre"
  status: "certified"
  notes:
    - "Current release dual_certification report certifies this form as EVAS/Spectre pass; rerun is required after checker/gold behavior changes."
