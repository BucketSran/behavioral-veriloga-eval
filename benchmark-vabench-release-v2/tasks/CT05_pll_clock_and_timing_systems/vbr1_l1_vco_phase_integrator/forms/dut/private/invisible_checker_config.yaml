schema_version: "vabench-release-v2-checks"
task_id: "vbr1_l1_vco_phase_integrator:dut"
checker:
  task_id: "vbr1_l1_vco_phase_integrator_dut"
  function: "check_vco_phase_integrator"
  source: "runners/simulate_evas.py"
# The remaining fields are inherited from release-v1 and remain private
# evaluator configuration until human review and fresh v2 dual rerun.
syntax:
  must_include:
    - "@(initial_step"
    - "@(timer("
    - "transition("
  must_not_include:
    - "I("
    - "ddt("
    - "idt("
dut_compile:
  backend: "evas"
tb_compile:
  backend: "evas"
sim_correct:
  checks:
    - "phase_span_covers_nearly_full_wrap"
    - "clock_toggles_on_phase_wrap"
    - "late_edge_rate_exceeds_early_edge_rate"
parity:
  required: true
  tolerance_notes: "Score phase-span and edge-rate behavior across stable control-voltage intervals."
