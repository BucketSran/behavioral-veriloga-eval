schema_version: "vabench-release-v2-checks"
task_id: "vbr1_l2_flash_adc_mini_array:e2e"
checker:
  task_id: "vbr1_l2_flash_adc_mini_array_e2e"
  function: "check_release_flash_adc_mini_array"
  source: "runners/simulate_evas.py"
# The remaining fields are inherited from release-v1 and remain private
# evaluator configuration until human review and fresh v2 dual rerun.
syntax:
  must_include:
    - "@(cross("
    - "transition("
    - "CMP0"
    - "CMP6"
  must_not_include:
    - "I("
    - "ddt("
    - "idt("
dut_compile:
  backend: "evas"
tb_compile:
  backend: "evas"
sim_correct:
  checks:
    - "all_8_flash_codes_present"
    - "comparator_threshold_ladder_matches_vin_bins"
    - "comparator_outputs_form_thermometer_prefix"
    - "binary_code_matches_comparator_count"
parity:
  required: true
  tolerance_notes: "Current release dual_certification report certifies this form as EVAS/Spectre pass; rerun is required after checker/gold behavior changes."
