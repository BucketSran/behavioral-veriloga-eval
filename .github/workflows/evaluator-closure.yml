name: Evaluator Closure

on:
  pull_request:
    paths:
      - ".github/workflows/evaluator-closure.yml"
      - "environment/**"
      - "pyproject.toml"
      - "uv.lock"
      - "runners/run_vabench_v3_model_eval.py"
      - "runners/simulate_evas.py"
      - "runners/agent_harness/**"
      - "scripts/run_v3_clean_room_smoke.py"
      - "scripts/run_v4_r53_clean_room_smoke.py"
      - "scripts/verify_evaluator_environment.py"
      - "schemas/vabench-experiment-result.schema.json"
      - "schemas/vaevas-*-v1.schema.json"
      - "benchmark-vabench-release-v4/operations/calibration_pilot/result_protocol.py"
      - "benchmark-vabench-release-v4/operations/calibration_pilot/final_replay.py"
      - "benchmark-vabench-release-v4/operations/calibration_pilot/run_campaign.py"
      - "benchmark-vabench-release-v4/operations/calibration_pilot/score_campaign.py"
      - "benchmark-vabench-release-v4/scripts/tests/test_v4_experiment_result_protocol.py"
      - "benchmark-vabench-release-v4/public-agent-runtime/**"
      - "tests/test_evaluator_environment_contract.py"
      - "tests/test_v3_clean_room_smoke.py"
      - "tests/test_v3_model_eval_claim_gate.py"
      - "tests/test_v4_r53_clean_room_smoke.py"
      - "tests/test_score_campaign_reuse.py"
      - "tests/test_agent_harness_*.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluator-closure.yml"
      - "environment/**"
      - "pyproject.toml"
      - "uv.lock"
      - "runners/run_vabench_v3_model_eval.py"
      - "runners/simulate_evas.py"
      - "runners/agent_harness/**"
      - "scripts/run_v3_clean_room_smoke.py"
      - "scripts/run_v4_r53_clean_room_smoke.py"
      - "scripts/verify_evaluator_environment.py"
      - "schemas/vabench-experiment-result.schema.json"
      - "schemas/vaevas-*-v1.schema.json"
      - "benchmark-vabench-release-v4/operations/calibration_pilot/result_protocol.py"
      - "benchmark-vabench-release-v4/operations/calibration_pilot/final_replay.py"
      - "benchmark-vabench-release-v4/operations/calibration_pilot/run_campaign.py"
      - "benchmark-vabench-release-v4/operations/calibration_pilot/score_campaign.py"
      - "benchmark-vabench-release-v4/scripts/tests/test_v4_experiment_result_protocol.py"
      - "benchmark-vabench-release-v4/public-agent-runtime/**"
      - "tests/test_evaluator_environment_contract.py"
      - "tests/test_v3_clean_room_smoke.py"
      - "tests/test_v3_model_eval_claim_gate.py"
      - "tests/test_v4_r53_clean_room_smoke.py"
      - "tests/test_score_campaign_reuse.py"
      - "tests/test_agent_harness_*.py"

permissions:
  contents: read

jobs:
  evaluator-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.13"

      - name: Install locked runtime and test environment
        run: |
          python -m pip install "uv==0.11.7"
          uv sync --locked --group dev --extra agentic --python 3.11.13

      - name: Verify installed evaluator identity
        run: |
          uv run --locked --extra agentic python scripts/verify_evaluator_environment.py \
            --run-evas \
            --evas-command evas \
            --json \
            > "$RUNNER_TEMP/evaluator-environment.json"
          uv run --locked --extra agentic python - "$RUNNER_TEMP/evaluator-environment.json" <<'PY'
          import json
          import pathlib
          import sys

          evidence = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert evidence["status"] == "pass", evidence
          assert evidence["live_evas"]["status"] == "pass", evidence
          PY

      - name: Run evaluator closure tests
        run: |
          uv run --locked --extra agentic python -m pytest -q \
            tests/test_agent_harness_*.py \
            tests/test_evaluator_environment_contract.py \
            tests/test_v3_clean_room_smoke.py \
            tests/test_v3_model_eval_claim_gate.py \
            benchmark-vabench-release-v4/scripts/tests/test_v4_experiment_result_protocol.py \
            tests/test_benchmarkv4_calibration_pilot.py \
            tests/test_score_campaign_reuse.py \
            tests/test_mini_swe_vabench.py \
            tests/test_v4_r53_active_entrypoints.py \
            tests/test_v4_r53_clean_room_smoke.py

      - name: Build pinned public and no-EVAS agent images
        working-directory: benchmark-vabench-release-v4/public-agent-runtime
        run: ./build.sh

      - name: Run r53 three-arm clean-room hidden-scoring smoke
        run: |
          uv run --locked --extra agentic python scripts/run_v4_r53_clean_room_smoke.py \
            --task-id v4-001 \
            --bound-final-authority \
            --evas-command "$(pwd)/.venv/bin/evas" \
            --output-root "$RUNNER_TEMP/r53-clean-room-output" \
            --out "$RUNNER_TEMP/r53-clean-room-smoke.json" \
            --json
          uv run --locked --extra agentic python - "$RUNNER_TEMP/r53-clean-room-smoke.json" <<'PY'
          import json
          import pathlib
          import sys

          smoke = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert smoke["status"] == "PASS", smoke
          assert smoke["benchmark_release"]["release_revision"] == "r53", smoke
          assert smoke["benchmark_release"]["evas_version"] == "0.8.7", smoke
          assert smoke["claim_gate"]["allowed"] is True, smoke
          assert smoke["claim_gate"]["model_score_claim_allowed"] is False, smoke
          assert smoke["claim_gate"]["paper_result_claim_allowed"] is False, smoke
          assert smoke["claim_gate"]["spectre_required"] is False, smoke
          assert {cell["experimental_arm"] for cell in smoke["cells"]} == {
              "OneShot",
              "Agent-No-EVAS",
              "Agentic",
          }, smoke
          assert all(
              cell["clean_room_contract"]["isolation_contract_satisfied"]
              and cell["trajectory"]["chain_verified"]
              and cell["final_submission"]["status"] == "available"
              and cell["final_submission"]["immutable"] is True
              and cell["score_sidecar"]["judge_runtime"] == "evas-sim==0.8.7"
              and cell["score_sidecar"]["score_authority"] == "development_only"
              and cell["bound_final_test"]["sidecar_hash_verified"]
              and cell["bound_final_test"]["generation_evidence_unchanged"]
              for cell in smoke["cells"]
          ), smoke
          assert sum(smoke["score_report"]["judge_statuses"].values()) == 3, smoke
          assert set(smoke["score_report"]["judge_statuses"]).issubset({
              "passed",
              "compile_failure",
              "runtime_failure",
              "behavior_failure",
          }), smoke
          by_arm = {cell["experimental_arm"]: cell for cell in smoke["cells"]}
          assert by_arm["Agent-No-EVAS"]["evas_usage"]["calls_executed"] == 0, smoke
          assert by_arm["Agentic"]["evas_usage"]["calls_executed"] >= 1, smoke
          version = smoke["execution_policy"]["evas_identity"]["version_output"]
          assert "evas-sim 0.8.7" in version and "loadable" in version, smoke
          PY
